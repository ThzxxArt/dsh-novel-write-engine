schema_version: 1
id: weird-horror
name: 怪谈克苏鲁
description: 规则文本，感官错位，具体细节承载不可解释的恐惧。
audience: general
genres: [mystery, horror, suspense]
pov: first
tense: past
register: restrained
narrative_distance: close

sentence:
  short_ratio: 0.4
  medium_ratio: 0.4
  long_ratio: 0.2
  burstiness: high
  max_consecutive_same_length: 4

paragraph:
  max_chars: 100
  one_action_per_paragraph: true
  max_sentences: 4
  max_actions: 3

dialogue:
  ratio: 0.25
  tag_style: sparse
  allow_interruptions: false
  allow_fragments: true

diction:
  abstract_emotion_density: low
  metaphor_density: low
  adjective_density: low
  slang: low
  idiom: low
  sensory_channels: [sound, smell, cold, touch, sight]

structure:
  opening_moves: [rule, anomaly, silence]
  scene_transition: hard_cut
  hook_moves: [new_rule, sanity_cost, unresolved_question]
  cool_point_every_chars: 1200

emotion:
  intensity: high
  expression: restrained
  required_beats: [body_reaction, cost, vulnerability]
  min_cues_per_1000: 2

banned_patterns:
  - 不是……而是……
  - 仿佛
  - 不禁
  - 眸中
  - 缓缓
  - 空气仿佛凝固
  - 心中五味杂陈
  - 嘴角勾起一抹
  - 命运的齿轮
  - 不可名状
  - 难以形容
  - 无法理解
  - 深渊
  - 亵渎
  - 扭曲
  - 低语
  - 疯狂

exemplars:
  - |
    值夜表上写着：凌晨两点到四点，不要看窗外。
    “你看了吗？”老周问。
    “没有。”我说。
    “那你窗户为什么开着？”
    “我睡前关了。”
    “你确定？”
    我张了张嘴，没说话。
    老周把值夜表翻过来，背面还有一行小字：如果有人问你看了吗，不要回答。
  - |
    “这层楼有404吗？”我问保安。
    “没有。”他头也没抬，“这栋楼最高就到403。”
    “可我昨天明明走过404。”
    “那你记错了。”
    “门牌上还写着我的名字。”
    保安终于抬头看了我一眼：“你叫什么？”
    我报完名字，他低头翻了翻登记本，脸色变了。
    “怎么了？”
    “今天没人登记过你。”

critic_rubric:
  - 规则：规则要短、具体、可执行，违反后的后果要可见。
  - 感官错位：用声音、温度、气味和触感制造不对劲。
  - 具体细节：恐惧落在门牌、水杯、值夜表这些物件上。
  - 不可靠：允许主角看错、记错、数错，但线索要能复盘。
  - 代价：每次接近真相都要付出失眠、受伤或记忆缺失。
  - 情绪：恐惧、恶心、好奇、否认都要落在身体和选择上。

thresholds:
  burstiness_min: 0.35
  dialogue_ratio_min: 0.25
  dialogue_ratio_max: 0.6
  banned_patterns_max: 1
  abstract_emotion_max: 2
  metaphor_per_1000_max: 3
