schema_version: 1
name: default
version: "1.1.0"

lexicon:
  zero_tolerance:
    - { term: "总而言之", note: "AI 套话" }
    - { term: "不可否认", note: "AI 套话" }
    - { term: "不禁", note: "AI 套话", match: standalone }
    - { term: "仿佛", note: "AI 套话", match: standalone }
    - { term: "似乎", note: "AI 套话", match: standalone }
    - { term: "嘴角微微上扬", note: "模板动作" }
    - { term: "眼中闪过一丝", note: "模板表情" }
    - { term: "心中暗道", note: "模板心理" }
    - { term: "殊不知", note: "叙事套话" }
    - { term: "与此同时", note: "转场套话" }
    - { term: "话虽如此", note: "转折套话" }
    - { term: "换句话说", note: "解释套话" }
    - { term: "与此同时的", note: "重复表达" }
    - { term: "油然而生", note: "成语套话" }
    - { term: "不由自主", note: "成语套话" }
    - { term: "若有所思", note: "成语套话" }
    - { term: "意味深长", note: "成语套话" }
    - { term: "哭笑不得", note: "成语套话" }
    - { term: "五味杂陈", note: "成语套话" }
    - { term: "如释重负", note: "成语套话" }
    - { term: "醍醐灌顶", note: "成语套话" }
    - { term: "恍然大悟", note: "成语套话" }
    - { term: "电光火石", note: "成语套话" }
    - { term: "千钧一发", note: "成语套话" }
    - { term: "浑然不觉", note: "成语套话" }
    - { term: "不置可否", note: "成语套话" }
    - { term: "若有所思地", note: "成语套话" }
    - { term: "深吸一口气", note: "模板动作" }
    - { term: "缓缓开口", note: "模板动作" }
    - { term: "淡淡说道", note: "模板台词" }
    - { term: "冷冷地说", note: "模板台词" }
    - { term: "微微一笑", note: "模板动作" }
    - { term: "眉头一皱", note: "模板动作" }
    - { term: "心中一凛", note: "模板心理" }
    - { term: "心头一震", note: "模板心理" }
    - { term: "后背发凉", note: "模板生理" }
    - { term: "头皮发麻", note: "模板生理" }
    - { term: "瞳孔骤缩", note: "模板生理" }
    - { term: "倒吸一口凉气", note: "模板生理" }
    - { term: "空气仿佛凝固", note: "模板环境" }
    - { term: "死一般的寂静", note: "模板环境" }
    - { term: "时间仿佛静止", note: "模板环境" }
    - { term: "命运的齿轮", note: "叙事套话" }
    - { term: "一波未平一波又起", note: "叙事套话" }
    - { term: "说来话长", note: "叙事套话" }
    - { term: "果然不出所料", note: "叙事套话" }
    - { term: "果不其然", note: "叙事套话" }
    - { term: "毫无意外", note: "叙事套话" }
    - { term: "显而易见", note: "叙事套话" }
    - { term: "显而易见地", note: "叙事套话" }
    - { term: "不容置疑", note: "叙事套话" }
    - { term: "毋庸置疑", note: "叙事套话" }
    - { term: "众所周知", note: "元叙述" }
    - { term: "值得一提的是", note: "元叙述" }
    - { term: "需要指出的是", note: "元叙述" }
    - { term: "让我们", note: "读者侵入" }
    - { term: "读者朋友们", note: "读者侵入" }
    - { term: "各位看官", note: "读者侵入" }
    - { term: "话说回来", note: "转场套话" }
    - { term: "另一方面", note: "转场套话" }
    - { term: "正因如此", note: "解释套话" }
    - { term: "正是因为", note: "解释套话" }

  soft:
    - { term: "犹如", limit: 1 }
    - { term: "宛若", limit: 1 }
    - { term: "宛如", limit: 1 }
    - { term: "仿佛置身", limit: 1 }
    - { term: "瞬间", limit: 3 }
    - { term: "立刻", limit: 4 }
    - { term: "顿时", limit: 4 }
    - { term: "猛地", limit: 3 }
    - { term: "陡然", limit: 2 }
    - { term: "骤然", limit: 2 }
    - { term: "缓缓", limit: 4 }
    - { term: "轻轻", limit: 4 }
    - { term: "微微", limit: 4 }
    - { term: "淡淡", limit: 3 }
    - { term: "冷冷", limit: 3 }
    - { term: "默默", limit: 3 }
    - { term: "静静", limit: 3 }
    - { term: "深深", limit: 3 }
    - { term: "紧紧", limit: 3 }
    - { term: "死死", limit: 2 }

  contextual:
    - { term: "赋能", limit: 2, genres: [都市现代, 游戏系统] }
    - { term: "闭环", limit: 2, genres: [都市现代, 科幻] }
    - { term: "颗粒度", limit: 1, genres: [都市现代] }
    - { term: "对齐", limit: 2, genres: [都市现代] }
    - { term: "灵根", limit: 6, genres: [玄幻修仙] }
    - { term: "灵气", limit: 8, genres: [玄幻修仙] }
    - { term: "副本", limit: 8, genres: [游戏系统, 无限流] }
    - { term: "系统提示", limit: 6, genres: [游戏系统, 无限流] }

  meta_narration:
    - { term: "不难看出" }
    - { term: "可以看出" }
    - { term: "由此可见" }
    - { term: "话说", match: line_start }
    - { term: "且说", match: line_start }
    - { term: "却说", match: line_start }

  reader_intrusion:
    - { pattern: "我们(?:可以)?看(?:到)?(?:这里|下面|接下来|这一幕|这个|这场|这段)" }
    - { pattern: "各位读者" }
    - { pattern: "屏幕前的" }

  god_view:
    - { pattern: "这注定是" }
    - { pattern: "当时的.{0,4}还不知道" }
    - { pattern: "多年以后" }
    - { pattern: "命运早已" }

  conclusion_first:
    verbs: [感到, 觉得, 知道, 明白, 意识到, 发现, 察觉]
    causals: [因为, 所以, 于是, 因此, 由于]

  ai_tone:
    version: 1
    categories:
      meta_commentary:
        code: AI_TONE_META
        default_severity: blocker
        default_scope: narration
        limit: 1
        window: 1000
        escalation: one_level
        note: "点评句子本身，破坏沉浸；旁白直接 blocker，对白先 advisory"
      ack_loop:
        code: AI_TONE_ACK
        default_severity: advisory
        default_scope: any
        limit: 1
        window: 800
        escalation: one_level
        note: "记账式确认，连续出现像客服"
      empty_comparative:
        code: AI_TONE_COMPARATIVE
        default_severity: advisory
        default_scope: any
        limit: 2
        window: 1000
        escalation: one_level
        note: "空转比较，没有具体对象/计量"
      protective_cliche:
        code: AI_TONE_PROTECTIVE
        default_severity: advisory
        default_scope: any
        limit: 2
        window: 1000
        escalation: one_level
        note: "守护型短句套路"
      socratic_trope:
        code: AI_TONE_SOCRATIC
        default_severity: advisory
        default_scope: any
        limit: 1
        window: 1000
        escalation: one_level
        note: "导师式反问，人物像在给读者上课"
      template_phrase:
        code: AI_TONE_TEMPLATE
        default_severity: advisory
        default_scope: any
        limit: 1
        window: 1000
        escalation: none
        note: "可套用的句模"
      short_judgment:
        code: AI_TONE_JUDGMENT
        default_severity: advisory
        default_scope: any
        limit: 2
        window: 1000
        escalation: one_level
        note: "单字/短句评判，只在独立成句时命中"

    entries:
      - id: AI-META-001
        category: meta_commentary
        match: exact
        terms: [这句话稳, 这句稳, 这话稳]
        severity: blocker
        severity_in_dialogue: advisory
        scope: any
        note: "角色点评对方这句话本身"
        replacement: "删掉评判，换成反应动作：他把烟按灭，没接话。"
        false_positives: ["他说话很稳。"]

      - id: AI-META-002
        category: meta_commentary
        match: exact
        terms: [这句话接的漂亮, 这句话接得漂亮]
        severity: blocker
        severity_in_dialogue: advisory
        scope: any
        note: "点评对话技巧"
        replacement: "让人物用下一句行动/信息回应，而不是夸上一句。"

      - id: AI-META-003
        category: meta_commentary
        match: exact
        terms: [这句话我不接]
        severity: blocker
        severity_in_dialogue: advisory
        scope: any
        note: "把对话当成可接/可不接的球"
        replacement: "直接沉默、转身、换话题，或给一个具体拒绝理由。"

      - id: AI-META-004
        category: meta_commentary
        match: exact
        terms: [这话我留着]
        severity: blocker
        severity_in_dialogue: advisory
        scope: any
        note: "收藏对方的话，元叙述"
        replacement: "让人物把这句话变成后续行动的依据。"

      - id: AI-META-005
        category: meta_commentary
        match: exact
        terms: [这话我记下了]
        severity: blocker
        severity_in_dialogue: advisory
        scope: any
        note: "记账式元叙述"
        replacement: "写具体记录动作：他在纸角写下一个日期。"

      - id: AI-META-006
        category: meta_commentary
        match: exact
        terms: [这话我收下了]
        severity: blocker
        severity_in_dialogue: advisory
        scope: any
        note: "把话当礼物收下"
        replacement: "换成具体反应：他沉默两息，点头。"

      - id: AI-ACK-001
        category: ack_loop
        match: exact
        terms: [我记下了, 记下了, 我记得了, 记得了, 我记住了, 记住了]
        severity: advisory
        scope: any
        limit: 1
        window: 800
        exclude_if_matches:
          - '把.{0,8}记下了'
          - '在.{0,8}记下了'
        note: "记账式确认；正常动作'把账记下了'豁免"
        replacement: "改成动作/物件：他把日期写在纸角。"

      - id: AI-ACK-002
        category: ack_loop
        match: exact
        terms: [这个账我记住了, 这笔账我记住了]
        severity: advisory
        scope: any
        note: "把人际冲突写成账本"
        replacement: "给出具体筹码/期限/代价，不写'我记住了'。"

      - id: AI-ACK-003
        category: ack_loop
        match: exact
        terms: [他记得这事]
        severity: advisory
        scope: any
        note: "旁白替角色确认记忆"
        replacement: "让角色在后续行动里兑现记忆。"

      - id: AI-ACK-004
        category: ack_loop
        match: exact
        terms: [你这句话我记着]
        severity: advisory
        scope: any
        note: "记账式回应"
        replacement: "换成具体反应或条件：'等你回来再算。'"

      - id: AI-ACK-005
        category: ack_loop
        match: exact
        terms: [认你]
        severity: advisory
        scope: any
        note: "单字认领关系"
        replacement: "写具体承认的内容：认你的刀，不认你的理。"

      - id: AI-ACK-006
        category: ack_loop
        match: exact
        terms: [认下来]
        severity: advisory
        scope: any
        note: "抽象认领"
        replacement: "写清认下什么、代价是什么。"

      - id: AI-ACK-007
        category: ack_loop
        match: exact
        terms: [认这个]
        severity: advisory
        scope: any
        note: "抽象指认"
        replacement: "把'这个'替换成具体条件/物件/责任。"

      - id: AI-ACK-008
        category: ack_loop
        match: exact
        terms: [认得实]
        severity: advisory
        scope: any
        note: "抽象确认"
        replacement: "用证据/动作证明认，不用形容词。"

      - id: AI-ACK-009
        category: ack_loop
        match: regex
        pattern: '.{0,8}就是认了'
        severity: advisory
        scope: any
        note: "句型化认领"
        replacement: "直接写让步条件或拒绝。"

      - id: AI-ACK-010
        category: ack_loop
        match: exact
        terms: [行，我认]
        severity: advisory
        scope: any
        note: "模板化让步"
        replacement: "写让步的代价：'行，我退半步，账照算。'"

      - id: AI-COMP-001
        category: empty_comparative
        match: regex
        pattern: '比(之前|刚才|从前)(的)?(都)?(重|轻|强|稳|平|沉)'
        severity: advisory
        scope: any
        note: "比之前/刚才的空转比较；有具体计量时豁免"
        replacement: "给出可感的具体量：刀口深了半寸，虎口震得发麻。"

      - id: AI-COMP-002
        category: empty_comparative
        match: regex
        pattern: '.{1,12}比.{1,12}(沉|重|稳|轻)'
        severity: advisory
        scope: any
        exclude_if_matches:
          - '(?:这|那)(?:块|袋|个|把|件|张|条|只|匹|头|根|瓶|碗|杯|箱|车|斤|米|寸|尺).{0,10}比(?:这|那)'
          - '比(?:去年|前年|上个月|昨天|上次|从前).{0,8}(?:高|矮|长|短|重|轻).{0,6}(?:半|一|两|三|几|十)'
          - '\d+.{0,4}(?:斤|公斤|千克|克|吨|米|厘米|毫米|公里|里|尺|寸|元|块|岁|年|月|天|小时|分钟|秒)'
        note: "xx比xx的抽象比较；具体重量/尺寸/价格豁免"
        replacement: "写具体对象、单位、后果，而不是'更重/更稳'。"

      - id: AI-COMP-003
        category: empty_comparative
        match: exact
        terms: [声音没抖，但比刚才稳, 声音没抖但比刚才稳]
        severity: advisory
        scope: any
        note: "声音状态套话"
        replacement: "写声音的具体变化：尾音低了半度，最后一个字没落稳。"

      - id: AI-COMP-004
        category: empty_comparative
        match: exact
        terms: [比刚才轻, 比刚才重, 比刚才平]
        severity: advisory
        scope: any
        note: "比刚才系列"
        replacement: "写具体动作/声音/重量变化。"

      - id: AI-COMP-005
        category: empty_comparative
        match: exact
        terms: [比之前的都强]
        severity: advisory
        scope: any
        note: "空转最高级"
        replacement: "给出可验证的结果或代价。"

      - id: AI-COMP-006
        category: empty_comparative
        match: exact
        terms: [说的比谁都响]
        severity: advisory
        scope: any
        note: "用比较代替事实"
        replacement: "写谁说了什么、造成了什么后果。"

      - id: AI-PROT-001
        category: protective_cliche
        match: exact
        terms: [睡吧，我守着, 睡吧我守着]
        severity: advisory
        scope: any
        note: "守护型套话"
        replacement: "写具体守的动作：他搬凳子坐在门口，把灯芯挑暗。"

      - id: AI-PROT-002
        category: protective_cliche
        match: exact
        terms: [你去，我跟, 你去我跟]
        severity: advisory
        scope: any
        note: "跟随型套话"
        replacement: "写位置/动作：他落后半步，手按在刀柄上。"

      - id: AI-PROT-003
        category: protective_cliche
        match: exact
        terms: [回去睡]
        severity: advisory
        scope: any
        note: "关心型短句"
        replacement: "写具体安排：'东厢空着，门闩我修好了。'"

      - id: AI-PROT-004
        category: protective_cliche
        match: exact
        terms: [我不拦]
        severity: advisory
        scope: any
        note: "放任型套话"
        replacement: "写条件/代价：'你要去可以，刀留下。'"

      - id: AI-PROT-005
        category: protective_cliche
        match: exact
        terms: [我跟]
        severity: advisory
        scope: any
        note: "单字跟随"
        replacement: "写动作和理由。"

      - id: AI-PROT-006
        category: protective_cliche
        match: exact
        terms: [我不催你, 不催]
        severity: advisory
        scope: any
        note: "体贴型套话"
        replacement: "写具体时间/动作：'灯给你留着，什么时候回来都行。'"

      - id: AI-SOCR-001
        category: socratic_trope
        match: exact
        terms: [问别人还是问自己]
        severity: advisory
        scope: any
        note: "导师式反问"
        replacement: "直接给选择/后果，或让人物用行动回答。"

      - id: AI-SOCR-002
        category: socratic_trope
        match: regex
        pattern: '这话是(ta|TA|Ta|tA|他|她)告诉你的[，,]?\s*还是你自己想明白的'
        severity: advisory
        scope: any
        note: "追问信息来源的模板"
        replacement: "写具体证据链：谁在场、谁说过、哪一步对不上。"

      - id: AI-SOCR-003
        category: socratic_trope
        match: exact
        terms: [你自己掂量, 你掂量]
        severity: advisory
        scope: any
        note: "把判断推回对方的套话"
        replacement: "给出明确条件/期限/代价。"

      - id: AI-TPL-001
        category: template_phrase
        match: regex
        pattern: '^行[，,]\s*(认了|听你的|你说得对|你说了算|稳|重|轻|平|直)\s*[。！？!?]?$'
        severity: advisory
        scope: any
        note: "行，xxx；只匹配抽象让步/评判，不匹配'行，走吧'"
        replacement: "写让步的具体内容。"
        false_positives: ["行，走吧。", "行，先吃饭。"]

      - id: AI-TPL-002
        category: template_phrase
        match: template
        template: '什么心思都写{xx}上'
        severity: advisory
        scope: any
        note: "把心理活动写成字面"
        replacement: "写具体表情/动作/物件，不概括'心思'。"

      - id: AI-TPL-003
        category: template_phrase
        match: template
        template: '没接你的{xxx}'
        severity: advisory
        scope: any
        note: "把对话写成接球"
        replacement: "写沉默后的动作或新话题。"

      - id: AI-TPL-004
        category: template_phrase
        match: template
        template: '没接你那句{xxx}'
        severity: advisory
        scope: any
        note: "把对话写成接球"
        replacement: "写具体反应，不点评上一句。"

      - id: AI-TPL-005
        category: template_phrase
        match: exact
        terms: [收不回去]
        severity: advisory
        scope: any
        note: "抽象后果句"
        replacement: "写具体后果：话出口后，谁的手停住了。"

      - id: AI-JUDGE-001
        category: short_judgment
        match: exact
        terms: [很平]
        severity: advisory
        scope: any
        standalone: true
        note: "独立成句的评判"
        replacement: "写声音/情绪的具体变化。"

      - id: AI-JUDGE-002
        category: short_judgment
        match: exact
        terms: [很直]
        severity: advisory
        scope: any
        standalone: true
        note: "独立成句的评判"
        replacement: "写说话方式/动作，不概括性格。"

      - id: AI-JUDGE-003
        category: short_judgment
        match: exact
        terms: [稳]
        severity: advisory
        scope: any
        standalone: true
        exclude_if_matches:
          - '(下盘|手|脚步|声音|语气|局势|底盘).{0,4}稳'
          - '稳(住|下来|得很)'
        note: "单字评判；动作/状态描述豁免"
        replacement: "写具体稳定在哪里，或删掉。"
        false_positives: ["他下盘很稳。", "声音稳住了。"]

format:
  paragraph_max_words: 90
  forbid_markdown: true
  forbid_semicolon: true
  forbid_english_ellipsis: true
  title:
    pattern: "^第\\d+章\\s"
    min_chars: 4
    max_chars: 8
  system_labels:
    - "Day\\s*\\d+"
    - "第[0-9一二三四五六七八九十百]+卷"
    - "作者(?:按|说)?"
    # Anchored: 读者/书友 are ordinary nouns mid-sentence ("杂志的读者").
    - "^(?:读者|书友)"
  scene_separators: ["———", "***", "…………"]
  markdown_markers: ["#", "**", "---", ">", "|"]

punctuation:
  dash:
    base: { 战斗/动作章: 3, 日常过渡章: 4, 情感爆发章: 6, 纯叙事章: 3 }
    scale_words: 3000
    token: "——"
  # Chinese web fiction often uses short sentences; 8/100 flagged ordinary
  # narrative (e.g. 9.52/100). Keep a ceiling, but calibrate it for Chinese.
  period_density: { min: 1.5, max: 10 }
  ellipsis_run: { max: 1, token: "……" }
  uniform_sentence: { min_sentences: 8, ratio: 0.6 }
  consecutive_le: { max: 3, char: "了" }
  dialogue_dominant_ratio: 0.60

semantics:
  adjective_density:
    max: 4
    adjectives: [美丽, 漂亮, 英俊, 巨大, 渺小, 愤怒, 悲伤, 开心, 恐怖, 温柔, 冰冷, 炙热, 明亮, 昏暗]
  pleasure_density:
    min: 1
    keywords: [打脸, 逆袭, 震惊, 哗然, 跪, 服气, 反转, 暴涨, 秒杀, 碾压, 掌声, 惊呼, 目瞪口呆, 傻眼]
    window: 600
  sensory_density:
    min: 2
    senses: [看, 听, 闻, 触, 尝, 冷, 热, 香, 臭, 疼, 痒, 麻, 亮, 暗, 声, 响]
    window: 800
  water_words:
    window: 150
    threshold: 0.35
    scene_thresholds:
      战斗/动作章: 0.25
      日常过渡章: 0.35
      情感爆发章: 0.30
      纯叙事章: 0.40
    terms: [的就是, 的时候, 时候, 一个, 一种, 一些, 这个, 那个, 这样, 那样, 其实, 确实, 真的, 非常, 十分]
  # 0.2.17 style vocabulary. The style pack owns the *target*; the rulepack owns
  # the *words* (C10). Empty or absent means the matching density rule is silent.
  abstract_emotion:
    terms: [悲伤, 愤怒, 恐惧, 孤独, 委屈, 绝望, 幸福, 痛苦, 无奈, 心酸]
  metaphor:
    markers: [像, 如同, 仿佛, 宛如, 好似, 好比, 似的]
  emotion_cues:
    terms: [手, 肩, 喉, 呼吸, 心跳, 后背, 指尖, 掌心, 牙, 胃, 眼, 嘴角]

platform:
  fanqie: { words_per_chapter: [2000, 3000], dialogue_ratio: [0.40, 0.60] }
  qidian: { words_per_chapter: [2000, 3500], dialogue_ratio: [0.30, 0.50] }
  qimao: { words_per_chapter: [1500, 2500], dialogue_ratio: [0.45, 0.65] }
  jinjiang: { words_per_chapter: [2500, 4000], dialogue_ratio: [0.35, 0.55] }

genres:
  玄幻修仙:
    note: "力量体系必须自洽；升级要有代价，境界不能靠形容词抬升。"
    profile: { water_words: 0.30, pleasure_density: 2 }
  都市现代:
    note: "现实都市，冲突来自资源、关系与规则；爽点要落在可验证的行动上。"
    profile:
      water_words: 0.32
      pleasure_density: 1
      pleasure_keywords: [钱, 账, 数, 铺, 租, 工钱, 生意, 招牌]
      foreshadow_min_dormancy: 2
      motif_min_dormancy: 1
      foreshadow_dormant_after: 20
  西方奇幻: { note: "种族、语言与力量来源要建条目；奇观不能替代人物选择。" }
  悬疑推理:
    note: "线索先于解答出现；每个伏笔都要在归档台账中可核销。"
    profile: { period_density: { min: 1.5, max: 12 }, water_words: 0.30 }
  科幻: { note: "技术设定只写对情节有用的部分；禁止用术语代替冲突。" }
  游戏系统: { note: "系统提示是世界观内文本；奖励与惩罚必须可追踪。" }
  历史架空: { note: "礼制、称谓与器物要经得起基本推敲；不写现代口号。" }
  无限流: { note: "副本规则先立后破；每次通关都要付出可记账的代价。" }
  轻小说: { note: "关系推进靠具体互动，不靠内心独白宣布；对话要能区分说话人。" }
  军事: { note: "战术细节服务于人物选择；不写武器参数清单。" }
  末世流: { note: "生存资源必须记账；恐惧来自规则崩塌，不靠突然的音效式形容词。" }
  言情:
    note: "亲密关系按阶梯推进；单次独白要短，情绪落在动作上。"
    profile: { period_density: { min: 1.5, max: 12 }, pleasure_density: 2 }

crosschapter:
  duplicate_similarity: 0.9
  duplicate_advisory: 0.75
  duplicate_min_chars: 20
  foreshadow_min_dormancy: 2
  motif_min_dormancy: 1
  foreshadow_dormant_after: 20
  check_time: true
  lock_similarity: 0.75

quality:
  dimensions:
    - { id: R-W-01, max: 15 }
    - { id: R-W-02, max: 10 }
    - { id: R-W-03, max: 10 }
    - { id: R-W-04, max: 20 }
    - { id: R-W-05, max: 15 }
    - { id: R-W-12, max: 20 }
    - { id: R-W-11, max: 10 }
    - { id: R-W-13, max: 15 }
    - { id: R-W-14, max: 10 }
    - { id: R-W-15, max: 10 }
    - { id: R-W-06, max: 4 }
    - { id: R-W-07, max: 4 }
    - { id: R-W-08, max: 4 }
    - { id: R-W-09, max: 2 }
    - { id: R-W-10, max: 1 }

exclusions:
  - { pair: [META_NARRATION, LEX_ZERO_TOLERANCE], family: meta }
  - { pair: [READER_INTRUSION, LEX_ZERO_TOLERANCE], family: reader }
  - { pair: [GOD_VIEW, CONCLUSION_FIRST], family: perspective }
  - { pair: [DUPLICATE_PARAGRAPH, FS_REVISITED_TOO_SOON], family: repetition }
  - { pair: [RESOURCE_MISMATCH, TIME_REGRESSION], family: continuity }
  - { pair: [LEX_SOFT_LIMIT, LEX_ZERO_TOLERANCE], family: style }

exemptions: []
